<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<!--
  SPA deep-link recovery shim for GitHub Pages.

  Problem: GitHub Pages serves static files. A deep link like
    /p/checkout/review?id=42
  404s if the SPA only has /p/checkout/index.html on disk.

  Solution: this 404 page stashes the intended path in sessionStorage and
  redirects the browser to the closest known index.html. The SPA's entry
  reads sessionStorage on boot and restores history.replaceState so the
  router picks up where the user meant to land.

  Framework-agnostic: works with React Router, Vue Router, SvelteKit,
  vanilla anchor-driven SPAs. Assumes the SPA entry includes the small
  companion snippet below (copy into your app's index.html <head> above
  any router init):

    <script>
      (function () {
        var redirect = sessionStorage.ghPagesRedirect;
        if (redirect) {
          delete sessionStorage.ghPagesRedirect;
          if (redirect !== location.href) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>

  Inspired by the sessionStorage-based 404 pattern used on
  egds-prototype-kit's phase-8-distribution experiment.
-->
<script>
  (function () {
    // Stash the full requested URL (pathname + search + hash) for the SPA to
    // restore after it boots. Using sessionStorage (not query string) avoids
    // router frameworks double-parsing our redirect marker.
    sessionStorage.ghPagesRedirect = location.href;

    // Redirect to the closest ancestor "index" we can reach. The segments
    // we care about are known sub-trees the deploy lays down:
    //   /                         (production root)
    //   /p/{slug}/                (a production prototype)
    //   /branch/{slug}/           (a canary's root)
    //   /branch/{slug}/p/{proto}/ (a prototype on a canary)
    //
    // Walk the path from the right, stopping at the first of these.
    var path = location.pathname;
    var parts = path.split('/').filter(Boolean);
    var target = '/';
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === 'p' && parts[i + 1]) {
        // production prototype root
        target = '/' + parts.slice(0, i + 2).join('/') + '/';
        break;
      }
      if (parts[i] === 'branch' && parts[i + 1]) {
        // canary root — may or may not have a /p/{slug}/ further in.
        var probe = parts.slice(0, i + 2).join('/');
        var deeper = parts.slice(i + 2);
        if (deeper[0] === 'p' && deeper[1]) {
          target = '/' + probe + '/p/' + deeper[1] + '/';
        } else {
          target = '/' + probe + '/';
        }
        break;
      }
    }
    // Final fallback: repo root index.
    location.replace(target);
  })();
</script>
</head>
<body>
<p>Redirecting… if you are not redirected, <a href="/">return to the index</a>.</p>
</body>
</html>
